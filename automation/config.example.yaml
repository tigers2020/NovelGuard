# Copy to automation/config.yaml and adjust paths.

repos:
  novelguard:
    path: "."  # repo root (absolute path recommended for Hermes)
    default_branch: main
    # true = branch from current HEAD (dev on feature branches). false = checkout main first.
    use_current_branch_as_base: true
    lock_name: NovelGuard.lock

cursor:
  # First existing command wins: cursor-agent, agent, cursor
  commands:
    - cursor-agent
    - agent
  # -p = --print (headless). Prompt on stdin, not argv.
  args: ["-p", "--trust", "--force", "--approve-mcps"]
  dry_run: false

queue:
  path: automation/jobs/queue.sqlite
  stale_seconds: 120

daemon:
  poll_seconds: 15
  webhook: true

linear:
  repo_key: novelguard
  project_names: [NovelGuard]
  team_names: [NoverGuard, NovelGuard]
  webhook_host: 127.0.0.1
  webhook_port: 8765
  webhook_path: /linear/webhook
  # Optional: your stable ngrok URL (no trailing slash), e.g. https://foo.ngrok-free.dev
  webhook_public_url: ""
  webhook_secret: ""
  dedupe_ttl_seconds: 120

logs:
  dir: automation/logs

locks:
  dir: automation/locks

prompts:
  dir: automation/prompts

verify:
  minimal:
    - [python, -m, ruff, check, .]
    - [python, -m, mypy, src]
  web_extra:
    - [npm, run, lint]
  web_dir: web
  full:
    - [python, scripts/verify_phase_completion.py]
