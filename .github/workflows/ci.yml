# NovelGuard — default test suite + static checks (matches scripts/verify_phase_completion.py + npm lint)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

      - name: black (check only)
        run: python -m black --check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: npm lint (web)
        run: npm run lint
        working-directory: web

      - name: vitest (web)
        run: npm run test
        working-directory: web

      - name: verify packaging (static)
        run: python scripts/verify_packaging.py

      - name: fixture library smoke
        run: python scripts/fixture_library_smoke.py

      - name: generate large library fixture
        run: python scripts/generate_large_library_fixture.py

      - name: large library loading smoke
        run: python scripts/large_library_loading_smoke.py --skip-generate
