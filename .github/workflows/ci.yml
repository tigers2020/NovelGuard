# NovelGuard — default test suite + static checks (matches scripts/verify_phase_completion.py)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src

      - name: black (check only)
        run: python -m black --check .
